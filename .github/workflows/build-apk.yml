name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    # 1. تثبيت NDK الأحدث (الذي يطلبه Flutter 3.24) مع الأدوات الأساسية
    - name: Install NDK and Accept Licenses
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Create Android platform folder
      run: flutter create --project-name time_table . --platforms=android

    - name: Install dependencies
      run: flutter pub get

    - name: Clean Project
      run: flutter clean

    - name: Install dependencies again
      run: flutter pub get

    # 2. إجبار المشروع على استخدام NDK الجديد وإعداد Gradle
    - name: Configure Gradle and NDK
      run: |
        # تعيين إصدار NDK في build.gradle
        sed -i 's/ndkVersion .*/ndkVersion "27.0.12077973"/g' android/app/build.gradle
        # تعطيل Gradle Daemon لتجنب أخطاء الاتصال
        echo "org.gradle.daemon=false" >> android/gradle.properties

    # 3. البناء باستخدام NDK المحدد
    - name: Build APK (Debug)
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
