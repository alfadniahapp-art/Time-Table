name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. تنظيف شامل لذاكرة التخزين المؤقت قبل البدء
    - name: Clean Gradle and Flutter Caches
      run: |
        flutter clean
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/wrapper
        rm -rf android/.gradle

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install NDK and Accept Licenses
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    - name: Create Android platform folder
      run: flutter create --project-name time_table . --platforms=android

    - name: Install dependencies
      run: flutter pub get

    # 2. إجبار Gradle على استخدام إصدار متوافق مع Java 17
    - name: Set Gradle Version
      run: |
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

    # 3. إجبار المشروع على استخدام إصدار NDK المثبت
    - name: Set NDK Version
      run: |
        sed -i 's/ndkVersion .*/ndkVersion "26.1.10909125"/g' android/app/build.gradle

    # 4. البناء مع طباعة تفاصيل الأخطاء (Stacktrace) إذا فشل
    - name: Build APK (Debug)
      run: flutter build apk --debug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
