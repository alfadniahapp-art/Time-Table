name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    # الخطوة الجديدة: تثبيت NDK المطلوب لتجنب أخطاء التوافق
    - name: Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;26.1.10909125"

    - name: Create Android platform folder
      run: flutter create --project-name time_table . --platforms=android

    - name: Install dependencies
      run: flutter pub get

    # الخطوة الجديدة: إجبار Gradle على استخدام إصدار متوافق مع Java 17
    - name: Set Gradle Version
      run: |
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

    - name: Generate Icon Image from Library
      run: flutter test test/generate_icon_test.dart

    - name: Generate App Icons
      run: dart run flutter_launcher_icons

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
